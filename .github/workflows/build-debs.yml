name: Build .deb packages

# 触发条件 (三种都会建/挂载 Release):
#   - push v* 标签:    用 tag 名建 Release
#   - Release 发布:    挂载到该 Release
#   - 手动触发:        tag 留空则自动生成 manual-<utc>-<sha7>
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (留空则自动生成 manual-<utc>-<sha7>)'
        required: false
        default: ''
      prerelease:
        description: '标记为 prerelease'
        type: boolean
        default: true

jobs:
  # 先创建 (或复用) Release, 避免多个 matrix job 并发 create 时竞态
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute release tag
        id: tag
        run: |
          case "${{ github.event_name }}" in
            release)
              TAG="${{ github.event.release.tag_name }}"
              ;;
            workflow_dispatch)
              if [ -n "${{ inputs.tag }}" ]; then
                TAG="${{ inputs.tag }}"
              else
                TAG="manual-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
              fi
              ;;
            *)
              TAG="${{ github.ref_name }}"
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, will append assets."
            exit 0
          fi
          PRERELEASE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG

  build:
    name: ${{ matrix.ros_distro }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental || false }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- humble / jammy / Ubuntu 22.04 ----
          - ros_distro: humble
            arch: amd64
            runner: ubuntu-24.04
            experimental: false
          - ros_distro: humble
            arch: arm64
            runner: ubuntu-24.04-arm
            experimental: false
          # ---- jazzy / noble / Ubuntu 24.04 ----
          - ros_distro: jazzy
            arch: amd64
            runner: ubuntu-24.04
            experimental: false
          - ros_distro: jazzy
            arch: arm64
            runner: ubuntu-24.04-arm
            experimental: false
          # ---- lyrical / resolute / Ubuntu 26.04 ----
          - ros_distro: lyrical
            arch: amd64
            runner: ubuntu-24.04
            experimental: true
          - ros_distro: lyrical
            arch: arm64
            runner: ubuntu-24.04-arm
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "=== Disk usage AFTER cleanup ==="
          df -h /

      - name: Set up 18GB swap space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 18G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .deb (${{ matrix.ros_distro }} / ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: export
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            BUILD_JOBS=2
          outputs: type=local,dest=./debs
          # Per-arch GHA cache keeps native amd64/arm64 builds isolated.
          cache-from: type=gha,scope=${{ matrix.ros_distro }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.ros_distro }}-${{ matrix.arch }},mode=max

      - name: List .deb
        run: ls -lh debs/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" debs/*.deb --clobber
